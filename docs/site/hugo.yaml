# Hugo configuration for the go-runtime-sandbox documentation site.
#
# Theme is Docsy (github.com/google/docsy) pulled in as a Hugo module
# via go.mod. Docsy itself pulls Bootstrap + FontAwesome as Hugo
# modules transitively via its own go.mod — there is NO separate
# `dependencies` module to import (that path was retired in v0.15.0).
#
#   cd docs/site
#   npm install   # PostCSS + autoprefixer for the SCSS pipeline
#   hugo server   # local preview at http://localhost:1313/go-runtime-sandbox/
#   hugo          # production build into ./public
#
# Deployed to https://gke-demos.github.io/go-runtime-sandbox/ via
# .github/workflows/docs.yml.

baseURL: "https://gke-demos.github.io/go-runtime-sandbox/"
title: "go-runtime-sandbox"
languageCode: "en-us"

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/google/docsy

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark

menu:
  main:
    - name: GitHub
      url: https://github.com/gke-demos/go-runtime-sandbox
      weight: 50
    - name: Releases
      url: https://github.com/gke-demos/go-runtime-sandbox/releases
      weight: 60

params:
  copyright:
    authors: "go-runtime-sandbox contributors"
    from_year: 2026

  description: "Ships arbitrary Go source code into a Kubernetes Agent Sandbox, compiles and executes it inside the sandboxed pod, and returns the result. Built for the AI-agent use case: an LLM writes Go code, calls a tool, sees the output, iterates."

  ui:
    breadcrumb_disable: false
    sidebar_menu_compact: false
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    navbar_logo: false
    navbar_translucent_over_cover_disable: true
    footer_about_enable: true
    showLightDarkModeMenu: true
    feedback:
      enable: false

  github_repo: "https://github.com/gke-demos/go-runtime-sandbox"
  github_branch: "main"
  github_subdir: "docs/site"

  toc:
    enabled: true

  offlineSearch: true

  links:
    user:
      - name: "GitHub Discussions"
        url: "https://github.com/gke-demos/go-runtime-sandbox/discussions"
        icon: "fa-brands fa-github"
        desc: "Ask questions, share what you're building."
    developer:
      - name: "GitHub"
        url: "https://github.com/gke-demos/go-runtime-sandbox"
        icon: "fa-brands fa-github"
        desc: "Source code, issue tracker, releases."

  taxonomy:
    taxonomyCloud: []
    taxonomyPageHeader: []
