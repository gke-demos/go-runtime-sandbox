apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: go-runtime-template
  namespace: default
spec:
  # Have the controller create the per-sandbox headless Service that the
  # sandbox-router resolves via DNS (<sandbox-name>.<ns>.svc.cluster.local).
  # Without this, uploads/run-commands return 502 from the router.
  service: true
  podTemplate:
    metadata:
      labels:
        sandbox: go-runtime-sandbox
    spec:
      containers:
        - name: go-runtime
          image: ghcr.io/gke-demos/go-runtime-sandbox:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
