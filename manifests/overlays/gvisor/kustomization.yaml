apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Adds runtimeClassName: gvisor to the SandboxTemplate's pod spec. Use
# on GKE clusters with a gVisor-enabled node pool, or any cluster with
# a RuntimeClass named "gvisor". To target a different runtime
# (kata-containers, kata-qemu, etc.), copy this directory and change
# the runtimeClassName value in runtime-class-patch.yaml.
resources:
  - ../../base

patches:
  - path: runtime-class-patch.yaml
    target:
      group: extensions.agents.x-k8s.io
      version: v1alpha1
      kind: SandboxTemplate
      name: go-runtime-template
