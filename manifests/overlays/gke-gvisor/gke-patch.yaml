# Drop spec.service — GKE's bundled SandboxTemplate CRD is older and
# rejects this field. The addon's controller creates the per-sandbox
# Service unconditionally, so the toggle isn't needed here.
- op: remove
  path: /spec/service

# Container-level security context. The image already declares
# USER 1000 so the container runs non-root; we restate it here so the
# VAP can verify the spec without inspecting image metadata.
- op: add
  path: /spec/podTemplate/spec/containers/0/securityContext
  value:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# Pod-level security context. Matches the container; fsGroup ensures
# any future volumes are owned by the sandbox user.
- op: add
  path: /spec/podTemplate/spec/securityContext
  value:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

# gVisor scheduling on GKE Standard — node pools created with
# --sandbox=type=gvisor are tainted/labeled with this key.
- op: add
  path: /spec/podTemplate/spec/nodeSelector
  value:
    sandbox.gke.io/runtime: gvisor

- op: add
  path: /spec/podTemplate/spec/tolerations
  value:
    - key: sandbox.gke.io/runtime
      operator: Equal
      value: gvisor
      effect: NoSchedule
