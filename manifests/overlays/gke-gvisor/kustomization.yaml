apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Layers GKE's agent-sandbox Validating Admission Policy requirements
# on top of the basic gvisor overlay:
#   - container securityContext (runAsNonRoot, no privilege escalation,
#     dropped capabilities, RuntimeDefault seccomp)
#   - pod securityContext (matching non-root identity)
#   - gVisor node selector + toleration (required on GKE Standard;
#     ignored on Autopilot)
#
# Apply on GKE clusters where the agent-sandbox addon is enabled. On
# Autopilot you can leave the nodeSelector/toleration in place — the
# pod will schedule on autoprovisioned gVisor nodes regardless.
resources:
  - ../gvisor

patches:
  - path: gke-patch.yaml
    target:
      group: extensions.agents.x-k8s.io
      version: v1alpha1
      kind: SandboxTemplate
      name: go-runtime-template
