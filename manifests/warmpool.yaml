# SandboxWarmPool: keeps N pre-warmed sandboxes ready so the first
# tool call from an agent doesn't pay the ~8-10s cold-start cost of
# pod scheduling + readiness. Apply AFTER the SandboxTemplate (the
# pool references it by name).
#
# Tune `replicas` to your expected concurrent-session count plus
# headroom for replenishment. `OnReplenish` (the default below)
# means a pool slot is only recreated after the previous one is
# claimed; `Recreate` rotates them more aggressively when the
# template changes.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: go-runtime-warmpool
  namespace: default
spec:
  replicas: 2
  sandboxTemplateRef:
    name: go-runtime-template
  updateStrategy:
    type: OnReplenish
