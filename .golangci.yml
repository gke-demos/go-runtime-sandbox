version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      # Test files and the standalone smoke client lean on duplicated
      # string literals (filenames, JSON keys) for readability; goconst's
      # noise outweighs the benefit of extracting them to constants.
      - linters: [goconst]
        path: _test\.go
      - linters: [goconst]
        path: cmd/mcp-smoke-test/
    paths:
      - third_party$
      - builtin$
      - _examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - _examples$
